version: '3.8'
services:
  app:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    environment:
      - PUID=1005
      - PGID=1005
    networks:
      - nginx_network
      - traefik_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=Host(`portainer.halfsugar.tech`)"
      - "traefik.http.routers.nginx.entrypoints=websecure"
      - "traefik.http.routers.nginx.tls.certresolver=letsencrypt"
      - "traefik.http.services.nginx.loadbalancer.server.port=9443"
    volumes:
      - ${CONFIG_ROOT}/nginx-proxy-manager/data:/data
      - ${CONFIG_ROOT}/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
networks:
  nginx_network:
    name: nginx_network
