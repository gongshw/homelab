version: '3.5'
services:
  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:main
    environment:
      - PUID=1005
      - PGID=1005
      - TZ=Asia/Shanghai
      - OLLAMA_BASE_URL=http://ollama.halfsugar.tech
      - WEBUI_URL=https://open-webui.halfsugar.tech
      - OAUTH_CLIENT_ID=${OAUTH_CLIENT_ID}
      - OAUTH_CLIENT_SECRET=${OAUTH_CLIENT_SECRET}
      - OAUTH_PROVIDER_NAME=authentik
      - OPENID_PROVIDER_URL=https://auth.halfsugar.tech/application/o/open-webui/.well-known/openid-configuration
      - OPENID_REDIRECT_URI=https://open-webui.halfsugar.tech/oauth/oidc/callback
      - ENABLE_OAUTH_SIGNUP=true
      - ENABLE_LOGIN_FORM=false
      - OAUTH_MERGE_ACCOUNTS_BY_EMAIL=true
    volumes:
      - ${CONFIG_ROOT}/open-webui/data:/app/backend/data
    ports:
      - 8080:8080
    networks:
      - nginx_network      
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 1m

networks:
  nginx_network:
    name: nginx_network
    external: true
