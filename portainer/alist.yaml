version: '3.3'
services:
    alist:
        restart: always
        volumes:
            - '${CONFIG_ROOT}/alist:/opt/alist/data'
        environment:
            - PUID=0
            - PGID=0
            - UMASK=022
        container_name: alist
        image: 'xhofe/alist:latest'
        networks:
            - nginx_network
            - traefik_network
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.alist.rule=Host(`alist.halfsugar.tech`)"
            - "traefik.http.routers.alist.entrypoints=websecure"
            - "traefik.http.routers.alist.tls.certresolver=letsencrypt"
            - "traefik.http.services.alist.loadbalancer.server.port=5244"

networks:
  nginx_network:
    name: nginx_network
    external: true
  traefik_network:
    name: traefik_network
    external: true